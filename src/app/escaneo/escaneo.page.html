<ion-content [fullscreen]="true" [scrollY]="false">
  <div class="pantalla">

    <div class="foto-zona">
      @if (fotoActual) {
        <!-- Foto real tomada por el usuario -->
        <img [src]="fotoActual" alt="Foto escaneada por ti" class="foto-plato" />
      } @else {
        <!-- Degradado de respaldo si la foto no existe; la <img> se pone encima -->
        <img [src]="imagenDemo" (error)="ocultarImagen($event)" alt="Ejemplo de platillo a escanear" class="foto-plato" />
        @for (g of globos; track g.kcal) {
          <div class="globo" [style.top]="g.top" [style.left]="g.left">
            {{ g.kcal }} kcal
          </div>
        }
      }
    </div>

    <div class="panel-texto">
      <h1>Tu comida,<br>decodificada por IA</h1>
      <p>Desde escanear hasta llevar el registro — todo pasa automáticamente.</p>

      <div class="puntos">
        <span class="punto activo"></span>
        <span class="punto"></span>
        <span class="punto"></span>
      </div>

      <button class="boton-escanear" [disabled]="tomandoFoto" (click)="escanear()">
        <ion-icon name="camera-outline"></ion-icon>
        {{ tomandoFoto ? 'Abriendo cámara...' : 'Escanear alimento' }}
      </button>

      @if (fotos.length) {
        <div class="galeria">
          <p class="galeria-titulo">Tus escaneos</p>
          <div class="galeria-tira">
            @for (foto of fotos; track foto.filepath) {
              <button class="miniatura" (click)="opcionesFoto(foto, $index)">
                <img [src]="foto.webviewPath" alt="Escaneo guardado" />
              </button>
            }
          </div>
        </div>
      }
    </div>

  </div>
</ion-content>
